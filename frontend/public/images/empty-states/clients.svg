<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- An empty address book of clients: contact cards with a "+" to add one. Flat, in the empty-state palette. -->
  <ellipse cx="320" cy="394" rx="210" ry="16" fill="#e2e8f0"/>

  <!-- Back card -->
  <rect x="206" y="88" width="300" height="190" rx="18" fill="#dbe3ec" transform="rotate(-8 356 183)"/>

  <!-- Front card -->
  <rect x="150" y="150" width="320" height="210" rx="18" fill="#fff"/>
  <rect x="150" y="150" width="320" height="210" rx="18" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <path d="M168 150h284a18 18 0 0 1 18 18v22H150v-22a18 18 0 0 1 18-18z" fill="#64748b"/>
  <circle cx="176" cy="170" r="6" fill="#fff" opacity="0.8"/>
  <rect x="192" y="164" width="84" height="12" rx="6" fill="#475569"/>

  <!-- Avatar -->
  <circle cx="232" cy="262" r="46" fill="#e2e8f0"/>
  <circle cx="232" cy="248" r="17" fill="#64748b"/>
  <path d="M199 294a33 33 0 0 1 66 0z" fill="#64748b"/>

  <!-- Name, company, contact lines -->
  <rect x="298" y="220" width="130" height="16" rx="8" fill="#475569"/>
  <rect x="298" y="248" width="100" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="298" y="272" width="146" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="298" y="292" width="120" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="298" y="318" width="56" height="18" rx="9" fill="#5b9bd5" opacity="0.25"/>

  <!-- Add a client -->
  <circle cx="474" cy="144" r="34" fill="#5b9bd5"/>
  <path d="M474 128v32M458 144h32" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

  <!-- Sparkles -->
  <circle cx="128" cy="126" r="6" fill="#5b9bd5" opacity="0.5"/>
  <circle cx="530" cy="236" r="5" fill="#64748b" opacity="0.5"/>
  <circle cx="116" cy="330" r="4" fill="#64748b" opacity="0.4"/>
</svg>
