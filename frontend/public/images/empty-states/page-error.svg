<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- A page under repair: an app window with a wrench and a gear. Flat, in the empty-state palette. -->
  <ellipse cx="320" cy="404" rx="220" ry="16" fill="#e2e8f0"/>

  <!-- Window -->
  <rect x="120" y="70" width="400" height="290" rx="18" fill="#dbe3ec"/>
  <path d="M138 70h364a18 18 0 0 1 18 18v28H120V88a18 18 0 0 1 18-18z" fill="#64748b"/>
  <circle cx="148" cy="93" r="7" fill="#fff"/>
  <circle cx="172" cy="93" r="7" fill="#fff" opacity="0.7"/>
  <circle cx="196" cy="93" r="7" fill="#fff" opacity="0.45"/>
  <rect x="230" y="85" width="150" height="16" rx="8" fill="#475569"/>
  <rect x="138" y="132" width="364" height="210" rx="10" fill="#fff"/>

  <!-- Blank page content, dashed where it failed to load -->
  <rect x="160" y="156" width="120" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="160" y="184" width="190" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="160" y="232" width="150" height="88" rx="10" fill="none" stroke="#dbe3ec" stroke-width="4" stroke-dasharray="12 10"/>

  <defs>
    <!-- The open jaw of the wrench is cut out, not painted over. -->
    <mask id="jaw">
      <rect x="-60" y="-60" width="120" height="120" fill="#fff"/>
      <rect x="4" y="-15" width="60" height="30" fill="#000"/>
    </mask>
  </defs>

  <!-- Gear, half over the window frame -->
  <g transform="translate(486 330)">
    <g fill="#5b9bd5">
      <rect x="-7" y="-46" width="14" height="20" rx="3"/>
      <rect x="-7" y="26" width="14" height="20" rx="3"/>
      <rect x="-46" y="-7" width="20" height="14" rx="3"/>
      <rect x="26" y="-7" width="20" height="14" rx="3"/>
      <rect x="-7" y="-46" width="14" height="20" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="26" width="14" height="20" rx="3" transform="rotate(45)"/>
      <rect x="-46" y="-7" width="20" height="14" rx="3" transform="rotate(45)"/>
      <rect x="26" y="-7" width="20" height="14" rx="3" transform="rotate(45)"/>
      <circle r="31"/>
    </g>
    <circle r="12" fill="#fff"/>
  </g>

  <!-- Wrench across the page: handle lower left, open jaw upper right -->
  <g transform="translate(330 250) rotate(-35)">
    <rect x="-130" y="-15" width="160" height="30" rx="15" fill="#475569"/>
    <rect x="-116" y="-4" width="110" height="8" rx="4" fill="#64748b"/>
    <g transform="translate(62 0)" mask="url(#jaw)">
      <circle r="44" fill="#475569"/>
    </g>
    <rect x="12" y="-17" width="30" height="34" fill="#475569"/>
  </g>

  <!-- Sparkles -->
  <circle cx="98" cy="150" r="6" fill="#5b9bd5" opacity="0.5"/>
  <circle cx="556" cy="120" r="5" fill="#64748b" opacity="0.5"/>
  <circle cx="92" cy="320" r="4" fill="#64748b" opacity="0.4"/>
</svg>
