<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- Broken app window for "could not load" states. Flat, in the empty-state palette. -->
  <ellipse cx="320" cy="438" rx="230" ry="18" fill="#e2e8f0"/>

  <!-- Window frame and title bar -->
  <rect x="112" y="48" width="416" height="316" rx="18" fill="#dbe3ec"/>
  <path d="M130 48h380a18 18 0 0 1 18 18v30H112V66a18 18 0 0 1 18-18z" fill="#64748b"/>
  <circle cx="142" cy="72" r="7" fill="#fff"/>
  <circle cx="166" cy="72" r="7" fill="#fff" opacity="0.7"/>
  <circle cx="190" cy="72" r="7" fill="#fff" opacity="0.45"/>
  <rect x="226" y="64" width="160" height="16" rx="8" fill="#475569"/>

  <!-- Page content behind the glass -->
  <rect x="130" y="112" width="380" height="236" rx="10" fill="#fff"/>
  <rect x="152" y="134" width="120" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="152" y="162" width="200" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="152" y="182" width="170" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="152" y="222" width="96" height="96" rx="10" fill="#e2e8f0"/>
  <rect x="264" y="222" width="96" height="96" rx="10" fill="#e2e8f0"/>
  <rect x="376" y="222" width="112" height="96" rx="10" fill="#e2e8f0"/>

  <!-- Glass tint around the impact -->
  <path d="M338 204 L402 150 L436 226 Z" fill="#5b9bd5" opacity="0.14"/>
  <path d="M338 204 L270 262 L322 318 Z" fill="#5b9bd5" opacity="0.1"/>

  <!-- The hole: a shard that is missing -->
  <path d="M338 204 L372 186 L384 222 L352 236 Z" fill="#dbe3ec"/>
  <path d="M338 204 L372 186 L384 222 L352 236 Z" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cracks radiating from the impact -->
  <g fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 186 L398 150 L412 132 L430 112"/>
    <path d="M384 222 L424 230 L462 250 L510 256"/>
    <path d="M352 236 L346 272 L356 308 L350 348"/>
    <path d="M338 204 L300 196 L262 170 L226 162"/>
    <path d="M338 204 L310 238 L276 252 L240 288"/>
    <path d="M384 222 L420 276 L446 300"/>
    <path d="M372 186 L360 150 L366 120"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M300 196 L312 222 L310 238"/>
    <path d="M398 150 L424 176 L424 230"/>
    <path d="M346 272 L380 262 L420 276"/>
    <path d="M262 170 L276 214 L276 252"/>
    <path d="M360 150 L398 150"/>
  </g>

  <!-- Shards falling out -->
  <path d="M356 380 L382 366 L378 398 Z" fill="#5b9bd5" opacity="0.85"/>
  <path d="M292 404 L312 396 L304 418 Z" fill="#5b9bd5" opacity="0.6"/>
  <path d="M418 396 L438 404 L424 420 Z" fill="#5b9bd5" opacity="0.7"/>
  <path d="M250 424 L266 420 L260 432 Z" fill="#64748b" opacity="0.6"/>
  <path d="M392 428 L404 424 L400 436 Z" fill="#64748b" opacity="0.5"/>
</svg>
