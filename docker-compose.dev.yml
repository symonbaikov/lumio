# Development docker-compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis_dev_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
      - JWT_SECRET=finflow-dev-jwt-secret-do-not-use-in-production-abc123
      - JWT_REFRESH_SECRET=finflow-dev-jwt-refresh-secret-do-not-use-in-production-xyz789
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    command: sh -lc "NODE_OPTIONS=--max-old-space-size=2048 npm run migration:run:dev && NODE_OPTIONS=--max-old-space-size=2048 npm run start:dev"

  # frontend intentionally left on the production build (docker-compose.yml
  # defaults) here: `next dev` with Turbopack on Next.js 16.3.1 fails to write
  # per-route build-manifest.json files in this environment (every app-router
  # route 500s with ENOENT), and next dev --webpack breaks separately because
  # react-intlayer's editor/CJS code leaks Node builtins into the client
  # bundle. The prod build compiles and serves fine, just without hot reload.

volumes:
  postgres_dev_data:
  redis_dev_data:
