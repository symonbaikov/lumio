misconfigurations:
  - id: AVD-DS-0031
    paths:
      - "observability/grafana/Dockerfile"
    statement: >-
      GF_AUTH_ANONYMOUS_ENABLED is a Grafana boolean feature flag (set to
      "false" to disable anonymous access), not a credential. Trivy matches it
      only because the variable name contains "AUTH". The real Grafana secrets
      (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD) are injected at
      runtime and never appear in a Dockerfile.
